name: Build and Test (lyrical)
on:
  push:
    branches: [lyrical]
  pull_request:
    branches: [lyrical, rolling]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ros:lyrical-ros-base
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/dynamixel_hardware
      - uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-lyrical-${{ github.sha }}
          restore-keys: ccache-lyrical-
      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y ccache
          rosdep update
          rosdep install --from-paths src --ignore-src -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+ --cmake-args -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Test
        shell: bash
        run: |
          source /opt/ros/lyrical/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --all --verbose
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-lyrical
          path: |
            build/*/test_results/**/*.xml
            log/
